<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentcore chat</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8;      --panel: #ffffff;   --ink: #1c1b19;
    --muted: #6b6862;   --line: #e5e2dc;    --accent: #3a5a8c;
    --ok: #2f6b46;      --ok-bg: #e8f3ec;
    --warn: #8a5a1a;    --warn-bg: #fbf0df;
    --bad: #99332b;     --bad-bg: #fbe9e7;
    --free: #4a4a7a;    --free-bg: #eeeef7;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;    --panel: #1e1e24;   --ink: #e8e6e1;
      --muted: #96938c; --line: #33333c;    --accent: #8fb0e0;
      --ok: #8fd6a8;    --ok-bg: #1b2f23;
      --warn: #e0b070;  --warn-bg: #332a19;
      --bad: #eb9a92;   --bad-bg: #331f1d;
      --free: #b0b0e0;  --free-bg: #222234;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 620; letter-spacing: -.01em; }
  .spacer { flex: 1; }
  .chip {
    font: 11px/1 var(--mono); padding: 5px 8px; border-radius: 5px;
    background: var(--bg); border: 1px solid var(--line); color: var(--muted);
    white-space: nowrap;
  }
  select, button, textarea {
    font-family: inherit; font-size: 13px; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  main { flex: 1; display: grid; grid-template-columns: minmax(0,1.55fr) minmax(0,1fr); min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } #side { display: none; } }

  #chatcol { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  #log { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }

  .msg { max-width: 82%; }
  .msg.me { align-self: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; white-space: pre-wrap;
    border: 1px solid var(--line); background: var(--panel);
  }
  .me .bubble { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bot { cursor: pointer; }
  .bot.sel .bubble { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }

  .tag { font: 11px/1 var(--mono); padding: 4px 7px; border-radius: 4px; border: 1px solid transparent; }
  .t-ok   { background: var(--ok-bg);   color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
  .t-warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .t-bad  { background: var(--bad-bg);  color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
  .t-free { background: var(--free-bg); color: var(--free); border-color: color-mix(in srgb, var(--free) 30%, transparent); }
  .t-dim  { background: var(--bg); color: var(--muted); border-color: var(--line); }

  #composer { border-top: 1px solid var(--line); padding: 12px 18px; background: var(--panel); }
  #row { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 42px; max-height: 160px; line-height: 1.5; }
  #hint { font-size: 11.5px; color: var(--muted); margin-top: 7px; }

  #side { overflow-y: auto; padding: 18px; background: var(--panel); }
  .sec { margin-bottom: 22px; }
  .sec > h2 {
    font: 600 11px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 10px;
  }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 13px; }
  .kv b { font: 500 13px/1.5 var(--mono); }
  .empty { color: var(--muted); font-size: 13px; }

  .claim { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
  .claim.bad { border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-bg); }
  .claim p { margin: 0 0 7px; font-size: 13.5px; }
  .src { font: 11px/1 var(--mono); color: var(--accent); background: var(--bg);
         border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; margin-right: 5px; }
  details summary { font-size: 12px; color: var(--muted); cursor: pointer; margin-top: 6px; }
  details p { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--line);
              padding-left: 9px; margin: 7px 0 0; white-space: pre-wrap; }
  .viol { font-size: 12px; color: var(--bad); margin-top: 5px; }

  #drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px;
          text-align: center; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  .doc { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .doc code { font: 12px var(--mono); color: var(--accent); }
  .doc small { color: var(--muted); font-size: 11px; }
  .x { border: none; background: none; color: var(--muted); font-size: 15px; padding: 0 4px; line-height: 1; }
  .x:hover { color: var(--bad); }
  #err { color: var(--bad); font-size: 12.5px; margin-top: 8px; }
  .bubble pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
                padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
  .bubble code { font: 12.5px var(--mono); }
  .bubble pre code { font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>agentcore chat</h1>
  <span class="chip" id="model">…</span>
  <span class="spacer"></span>
  <select id="mode" title="응답 경로">
    <option value="auto">자동 판단</option>
    <option value="grounded">문서 근거만</option>
    <option value="free">자유 대화</option>
  </select>
  <button id="forget" title="이 세션의 기억만 삭제. 문서는 남습니다">기억 삭제</button>
</header>

<main>
  <div id="chatcol">
    <div id="log"></div>
    <div id="composer">
      <div id="row">
        <textarea id="q" rows="1" placeholder="질문을 입력하세요.  Enter 전송 · Shift+Enter 줄바꿈"></textarea>
        <button id="send">전송</button>
      </div>
      <div id="hint"></div>
    </div>
  </div>

  <aside id="side">
    <div class="sec">
      <h2>검증</h2>
      <div id="verify"><p class="empty">답변을 클릭하면 그 답이 어떻게 검증되었는지 보여줍니다.</p></div>
    </div>
    <div class="sec">
      <h2>문서</h2>
      <div id="drop">.md / .txt 를 끌어다 놓거나 클릭해 선택</div>
      <input type="file" id="file" multiple accept=".md,.txt,.markdown" hidden>
      <div id="docs"></div>
      <div id="err"></div>
    </div>
    <div class="sec">
      <h2>세션</h2>
      <div id="session"></div>
    </div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const log = $('#log'), qbox = $('#q');
let turns = [], selected = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 자유 대화는 마크다운으로 온다. **이스케이프된 문자열 위에서만** 돌기 때문에
   모델이 무엇을 뱉든 HTML 로 해석되지 않는다 — 순서를 뒤집으면 XSS 다. */
function md(raw) {
  return esc(raw)
    .replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => `<pre><code>${c.replace(/\n$/, '')}</code></pre>`)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/^### (.+)$/gm, '<b>$1</b>')
    .replace(/^## (.+)$/gm, '<b>$1</b>');
}

/* 답변의 상태를 한 눈에 — 검증됨 / 차단됨 / 근거없음 / 검증불가는 서로 다른 것이다. */
function tags(a) {
  const t = [];
  if (a.route === 'free') {
    t.push(['t-free', '검증 불가 · 자유 대화']);
  } else if (a.blocked) {
    t.push(['t-bad', `가드레일 차단 ${a.guardrails.breach_count}건`]);
  } else if (a.missing.length) {
    t.push(['t-warn', '근거 문서 없음']);
  } else if (a.grounded) {
    t.push(['t-ok', '근거 확인됨']);
  } else {
    t.push(['t-warn', '근거 미확인']);
  }
  if (a.sources.length) t.push(['t-dim', '출처 ' + a.sources.join(', ')]);
  if (a.rounds > 1) t.push(['t-dim', `재작성 ${a.rounds}회`]);
  return t.map(([c, s]) => `<span class="tag ${c}">${esc(s)}</span>`).join('');
}

function addMe(text) {
  log.insertAdjacentHTML('beforeend',
    `<div class="msg me"><div class="bubble">${esc(text)}</div></div>`);
  log.scrollTop = log.scrollHeight;
}

function addBot(a) {
  const i = turns.push(a) - 1;
  const body = a.route === 'free' ? md(a.text) : esc(a.text);
  log.insertAdjacentHTML('beforeend',
    `<div class="msg bot" data-i="${i}"><div class="bubble">${body}</div>
     <div class="meta">${tags(a)}</div></div>`);
  log.scrollTop = log.scrollHeight;
  select(i);
}

function addNote(text) {
  log.insertAdjacentHTML('beforeend',
    `<div class="msg"><div class="meta"><span class="tag t-dim">${esc(text)}</span></div></div>`);
  log.scrollTop = log.scrollHeight;
}

log.addEventListener('click', e => {
  const el = e.target.closest('.bot');
  if (el) select(+el.dataset.i);
});

function select(i) {
  selected = i;
  document.querySelectorAll('.bot').forEach(el => el.classList.toggle('sel', +el.dataset.i === i));
  renderVerify(turns[i]);
}

function renderVerify(a) {
  const m = a.metrics;
  let h = '';

  if (a.route === 'free') {
    h += `<p class="empty">자유 대화 경로입니다. 검색·검증기·가드레일을
      <b>지나지 않았습니다</b>. 이 출력은 검증 실패가 아니라 <b>검증 대상이
      아닙니다</b> — 사실 확인이 필요하면 문서를 올리고 "문서 근거만" 모드로
      물어보세요.</p>`;
  } else if (a.missing.length) {
    h += `<p class="empty">충분성 게이트에서 멈췄습니다. 미충족 슬롯:
      <code>${esc(a.missing.join(', '))}</code>. 모델은 <b>호출되지 않았습니다</b>
      — 게이트는 비싼 작업 앞에 섭니다.</p>`;
  } else {
    h += `<div style="margin-bottom:10px">${a.claims.map(c => `
      <div class="claim ${c.breaches.length ? 'bad' : ''}">
        <p>${esc(c.text)}</p>
        ${c.sources.map(s => `<span class="src">${esc(s)}</span>`).join('')}
        ${c.breaches.map(b => `<div class="viol">✗ ${esc(b)}</div>`).join('')}
        ${c.support.length ? `<details><summary>근거 원문 보기</summary>
          ${c.support.map(s => `<p>${esc(s.slice(0, 600))}</p>`).join('')}</details>` : ''}
      </div>`).join('') || '<p class="empty">주장이 없습니다.</p>'}</div>`;

    if (a.residual.length) {
      h += `<div class="sec"><h2>잔여 위반</h2>` +
        a.residual.map(r => `<div class="viol">✗ ${esc(r)}</div>`).join('') + `</div>`;
    }
    const rails = Object.entries(a.guardrails.by_rail);
    h += `<div class="kv"><span>가드레일</span><b>${rails.length
      ? rails.map(([k, v]) => `${esc(k)} ${v}`).join(' · ') : '위반 0건'}</b></div>`;
    h += `<div class="kv"><span>재작성 라운드</span><b>${a.rounds}</b></div>`;
  }

  h += `<div class="kv"><span>경로</span><b>${esc(a.route)}</b></div>`;
  h += `<div class="kv"><span>토큰</span><b>${m.tokens.toLocaleString()}</b></div>`;
  h += `<div class="kv"><span>모델 호출</span><b>${m.model_calls}</b></div>`;
  h += `<div class="kv" title="코드가 내린 제어 결정 / 전체 결정"><span>제어 비율</span><b>${m.control_ratio}</b></div>`;
  h += `<div class="kv" title="워커가 흡수한 토큰 / 코어로 올라간 토큰"><span>격리 효과</span><b>${m.isolation_ratio} : 1</b></div>`;
  $('#verify').innerHTML = h;
}

/* ---------------------------------------------------------------- 전송 */
async function send() {
  const question = qbox.value.trim();
  if (!question) return;
  qbox.value = ''; qbox.style.height = 'auto';
  addMe(question);
  $('#send').disabled = true;
  $('#hint').textContent = '생각 중… (구독 경로는 몇 초 걸립니다)';
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, mode: $('#mode').value}),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    addBot(await r.json());
    refreshState();
  } catch (e) {
    addNote('오류: ' + e.message);
  } finally {
    $('#send').disabled = false; $('#hint').textContent = ''; qbox.focus();
  }
}

$('#send').onclick = send;
qbox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
qbox.addEventListener('input', () => {
  qbox.style.height = 'auto';
  qbox.style.height = Math.min(qbox.scrollHeight, 160) + 'px';
});

/* ---------------------------------------------------------------- 문서 */
function renderDocs(docs) {
  $('#docs').innerHTML = docs.length
    ? docs.map(d => `<div class="doc"><code>${esc(d.id)}</code>
        <small>${d.chars.toLocaleString()}자</small><span class="spacer"></span>
        <button class="x" data-id="${esc(d.id)}" title="철회">×</button></div>`).join('')
    : '<p class="empty">문서 없음 — 지금은 자유 대화만 가능합니다.</p>';
  $('#docs').querySelectorAll('.x').forEach(b => b.onclick = async () => {
    const r = await fetch('/api/documents/' + encodeURIComponent(b.dataset.id), {method: 'DELETE'});
    if (r.ok) { renderDocs((await r.json()).documents); addNote(`문서 철회: ${b.dataset.id}`); }
  });
}

async function upload(files) {
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('files', f);
  $('#err').textContent = '';
  const r = await fetch('/api/documents', {method: 'POST', body: fd});
  if (!r.ok) { $('#err').textContent = '업로드 실패'; return; }
  const j = await r.json();
  renderDocs(j.documents);
  if (j.added.length) addNote(`문서 추가: ${j.added.join(', ')}`);
  if (j.skipped.length) $('#err').textContent =
    j.skipped.map(s => `${s.name}: ${s.why}`).join(' · ');
}

$('#drop').onclick = () => $('#file').click();
$('#file').onchange = e => { upload([...e.target.files]); e.target.value = ''; };
['dragenter','dragover'].forEach(t => $('#drop').addEventListener(t, e => {
  e.preventDefault(); $('#drop').classList.add('over'); }));
['dragleave','drop'].forEach(t => $('#drop').addEventListener(t, e => {
  e.preventDefault(); $('#drop').classList.remove('over'); }));
$('#drop').addEventListener('drop', e => upload([...e.dataTransfer.files]));

$('#forget').onclick = async () => {
  const r = await fetch('/api/memory', {method: 'DELETE'});
  const j = await r.json();
  addNote(`기억 ${j.removed}건 삭제 — 문서 인덱스는 그대로입니다`);
  refreshState();
};

/* ---------------------------------------------------------------- 상태 */
async function refreshState() {
  const s = await (await fetch('/api/state')).json();
  $('#model').textContent = s.model;
  renderDocs(s.documents);
  const x = s.session;
  $('#session').innerHTML =
    `<div class="kv"><span>턴</span><b>${x.turns}</b></div>
     <div class="kv"><span>모델 호출</span><b>${x.model_calls}</b></div>
     <div class="kv"><span>제어 비율</span><b>${x.control_ratio}</b></div>
     <div class="kv"><span>재시도</span><b>${x.retries}</b></div>`;
}

refreshState();
qbox.focus();
</script>
</body>
</html>
