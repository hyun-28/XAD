# TSAD-XAI environment — lab GPU server (Linux x86_64, CUDA 12.1).
# Identical to environment.yml except the nvidia channel and pytorch-cuda.
# On the Mac use environment.yml.
#
# THREE PINS ARE LOAD-BEARING (docs/TSBAD_INTERNALS.md §4, §7). Do not relax
# them without rerunning tests/.
#
#   scikit-learn <1.6
#       TSB-AD's BaseDetector has no __sklearn_tags__. On sklearn>=1.6,
#       check_is_fitted() raises AttributeError inside decision_function()
#       (TSB_AD/models/IForest.py:238). fit() still works, so the failure only
#       appears once you start scoring perturbations. Fallback if you cannot
#       pin: src/compat.patch_tsb_ad().
#   numpy <2
#       TSB-AD 1.5 declares numpy>=1.24.3,<2.0.
#   python 3.11
#       TSB-AD states support for >=3.8 up to 3.12; 3.11 is the tested middle.
#
# torch is required even for IForest: TSB_AD/utils/utility.py:19 imports
# torch.nn at module level. 2.3.0 is the version TSB-AD's own README installs.
#
# Reproduce:  conda env create -f environment.server.yml && conda activate tsadxai
# Exact resolution of the verified build: requirements.lock.txt (pip freeze).
name: tsadxai
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24.3,<2.0
  - scipy
  - scikit-learn>=1.3.2,<1.6
  - pandas>=2.0.3,<3.0
  - matplotlib>=3.7.5
  - seaborn
  - statsmodels
  - tqdm
  - pytest
  - pyyaml
  - pytorch=2.3.0
  - torchvision=0.18.0
  - torchaudio=2.3.0
  - pytorch-cuda=12.1
  - pip:
      - TSB-AD==1.5
      - python-pptx>=1.0   # Task A: slide-deck provenance extraction
      - captum          # Integrated Gradients / Saliency / Occlusion (W3)
      # shap>=0.50 declares numpy>=2 -- incompatible with the numpy<2 pin above.
      - shap<=0.49.1    # KernelSHAP (W3)
      - hurst>=0.0.5    # imported by TSB_AD/models/feature.py
      - arch>=5.3.1
      - stumpy>=1.12.0
      - tslearn>=0.6.3
      - networkx>=3.1
      - einops
      - torchinfo
      - h5py
