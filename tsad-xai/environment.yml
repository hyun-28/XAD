# Verified against TSB_AD 1.5 (PyPI sdist inspected 2026-09-07).
#
# THREE PINS ARE LOAD-BEARING. Do not relax them without rerunning tests/.
#
#   scikit-learn <1.6
#       TSB-AD's BaseDetector has no __sklearn_tags__. On sklearn>=1.6,
#       check_is_fitted() raises AttributeError inside decision_function().
#       CONFIRMED FAILING on sklearn 1.8.0:
#         AttributeError: 'IForest' object has no attribute '__sklearn_tags__'
#       fit() still works, so the failure only appears once you start scoring
#       perturbations -- i.e. exactly when this project starts.
#       Fallback if you cannot pin: src/compat.patch_tsb_ad()
#
#   numpy <2
#       TSB-AD's own setup.py declares numpy>=1.24.3,<2.0.
#
#   python 3.11
#       TSB-AD states support for >=3.8 up to 3.12; 3.11 is the tested middle.
#
name: tsadxai
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24.3,<2.0
  - scipy
  - scikit-learn>=1.3.2,<1.6
  - pandas>=2.0.3,<3.0
  - matplotlib>=3.7.5
  - seaborn
  - statsmodels
  - tqdm
  - pytest
  # GPU build for the RTX A6000. Swap for cpuonly if testing on a laptop.
  - pytorch=2.3.0
  - torchvision=0.18.0
  - torchaudio=2.3.0
  - pytorch-cuda=12.1
  - pip:
      - TSB-AD==1.5
      - captum          # Integrated Gradients / Saliency / Occlusion
      # shap>=0.50 declares numpy>=2 -- incompatible with the numpy<2 pin above.
      - shap<=0.49.1    # KernelSHAP
      - hurst>=0.0.5    # imported by TSB_AD/models/feature.py
      - arch>=5.3.1
      - stumpy>=1.12.0
      - tslearn>=0.6.3
      - networkx>=3.1
      - einops
      - torchinfo
      - h5py
